ue="1">1×</option> <option value="2">2×</option> <option value="2.5">2.5×</option> <option value="3">3×</option> <option value="4">4×</option> <option value="5">5×</option> <option value="10">10×</option> </select> </div> </section>  <script type="module" src="/astro-animations/js/tierra/main-tierra.js"></script> </body> </html>
